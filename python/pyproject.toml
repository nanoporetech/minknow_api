[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[project]
name = "minknow-api"
dynamic = ["version"]
description = "MinKNOW RPC API bindings"
readme = "README.md"
license = "MPL-2.0"
authors = [
    { name = "Oxford Nanopore Technologies PLC", email = "info@nanoporetech.com" },
]
dependencies = [
    "numpy >=1.21, <3",  # minknow_api.data
    "packaging >=15.0",
    "pyrfc3339 >=1.1, <3",

    # These versions are strongly linked to the grpcio-tools version used to
    # generate code from protobuf files in .gitlab-ci.yml, see
    # https://protobuf.dev/support/cross-version-runtime-guarantee/
    "grpcio ~=1.63",        # must be >= grpcio-tools version
    "protobuf >=5.26, <7",  # linked to protoc version embedded in grpcio-tools

    "googleapis-common-protos==1.70.0",  # for google/rpc/status.proto
]

[project.urls]
Homepage = "https://github.com/nanoporetech/minknow_api"

[tool.hatch.version]
# NB: this is created by ../dev_tools/write_version.py
path = "minknow_api/_version.py"

[tool.hatch.build.targets.wheel]
include = [
    "minknow_api",
]

[tool.hatch.build.targets.sdist]
include = [
    "minknow_api",
    "test",
]

[tool.pytest.ini_options]
minversion = 6.0
pythonpath = "test"
addopts = "--import-mode=importlib"
